version: '3.8'
services:
  api:
    build: ./server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env.example   # Unit 6: systematic env var injection from file
    environment:
      - NODE_ENV=production     # Override specific keys on top of env_file
      - PORT=5000
    volumes:
      - ./server/uploads:/app/uploads # Persist uploads locally

  web:
    build: ./client
    ports:
      - "80:80"
    depends_on:
      - api
