version: '3.8'
services:
  api:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    # We will pass the rest of the .env variables during the actual run
    volumes:
      - ./server/uploads:/app/uploads # Persist uploads locally

  web:
    build: ./client
    ports:
      - "80:80"
    depends_on:
      - api
